[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [
  { id = "trailing-whitespace", exclude = "^(conformance/(goldens|pinned)/|data/)", priority = 0 },
  { id = "end-of-file-fixer", exclude = "^(conformance/(goldens|pinned)/|data/)", priority = 1 },
  { id = "mixed-line-ending", exclude = "^(conformance/(goldens|pinned)/|data/)", priority = 2 },
  { id = "check-merge-conflict", priority = 100 },
  { id = "check-added-large-files", args = ["--maxkb=20000"], priority = 100 },
  { id = "check-executables-have-shebangs", priority = 100 },
  { id = "check-shebang-scripts-are-executable", priority = 100 },
  { id = "check-case-conflict", priority = 100 },
  { id = "check-symlinks", priority = 100 },
  { id = "detect-private-key", priority = 100 },
  { id = "check-json", priority = 100 },
  { id = "check-toml", priority = 100 },
  { id = "check-yaml", args = ["--allow-multiple-documents"], priority = 100 },
]

[[repos]]
repo = "https://github.com/crate-ci/typos"
rev = "v1.48.0"
hooks = [
  { id = "typos", args = ["--force-exclude"], exclude = "^(conformance/(goldens|pinned|suites)/|data/|tools/|.*\\.md$)", priority = 100 },
]

[[repos]]
repo = "https://github.com/rhysd/actionlint"
rev = "v1.7.12"
hooks = [{ id = "actionlint-system", priority = 11 }]

[[repos]]
repo = "https://github.com/zizmorcore/zizmor-pre-commit"
rev = "v1.27.0"
hooks = [{ id = "zizmor", args = ["--min-severity", "high"], priority = 11 }]

[[repos]]
repo = "https://github.com/evanpurkhiser/prek-personal"
rev = "v1.0.2"
hooks = [
  { id = "shfmt-system", exclude = "^(conformance/|guest-control/)", priority = 10 },
  { id = "shellcheck-system", exclude = "^(conformance/|guest-control/)", priority = 11 },
]
